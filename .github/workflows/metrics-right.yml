name: Metrics Right

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OlanIsm

          filename: metrics-right.svg

          base: ""

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 30

          config_timezone: Asia/Jakarta
